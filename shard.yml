name: brotli
version: 0.3.0
description: |
  Brotli decoder + encoder (RFC 7932) in pure Crystal, ported from
  google/brotli (c/dec, c/enc). Decoder — for WOFF2 font decoding;
  encoder — quality 0..11, one-shot API (Brotli.encode). The reference
  C implementation is used as a test oracle only.
